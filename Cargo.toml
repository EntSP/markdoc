[package]
name = "markdoc"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/markdoc/markdoc"

# Standalone crate now — `flux-types`, `leptos-markdoc`, and
# `markdoc-pdf` were promoted to sibling crates one level up
# (../flux-types, ../leptos-markdoc, ../markdoc-pdf) and pin their
# own dependency versions.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
pulldown-cmark = "0.11"
indexmap = "2.0"
regex = "1.10"
serde_yaml = "0.9"
